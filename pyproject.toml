[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinsharing-client"
version = "0.1.0"
description = "Python client for PinSharing address and reverse geocoding"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "PinSharing"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://pinsharing.com"
Documentation = "https://pinsharing.com/docs"

[tool.setuptools.packages.find]
where = ["src"]
